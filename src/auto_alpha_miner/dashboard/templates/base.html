<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Auto Alpha Miner{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Mobile top nav -->
    <header class="mobile-nav">
        <div class="mobile-brand">
            <div class="brand-icon">A</div>
            <span class="brand-text">Alpha Miner</span>
        </div>
        <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
    </header>

    <div class="sidebar-overlay" onclick="document.querySelector('.sidebar').classList.remove('open')"></div>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">A</div>
            <span class="brand-text">AI Alpha Lab</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item {% if active == 'overview' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                <span data-i18n="nav.overview">Lab Overview</span>
            </a>
            <a href="/strategy" class="nav-item {% if active == 'strategy' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
                <span data-i18n="nav.backtest">Backtest</span>
            </a>
            <a href="/compare" class="nav-item {% if active == 'compare' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span data-i18n="nav.compare">Compare</span>
            </a>
            <a href="/portfolio" class="nav-item {% if active == 'portfolio' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
                <span data-i18n="nav.portfolio">Portfolio</span>
            </a>
            <a href="/research" class="nav-item {% if active == 'research' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span data-i18n="nav.research">Research</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="lang-switch">
                <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
                <button class="lang-btn" data-lang="ko" onclick="setLang('ko')">KO</button>
            </div>
            <div class="sidebar-footer-text">AI Alpha Lab v0.1<br><span style="opacity:0.5;" data-i18n="nav.footer.desc">Automated Strategy Discovery</span></div>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
            <div class="header-right">{% block header_right %}{% endblock %}</div>
        </header>
        <div class="page-body">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="/static/i18n.js"></script>
    <script src="/static/charts.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
